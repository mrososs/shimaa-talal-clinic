# Supabase local development configuration.
#
# This file is the source of truth for `supabase start`. It was written by hand
# for this workspace; if a future Supabase CLI adds required keys, run
# `supabase init --force` in a scratch directory and reconcile the diff rather
# than guessing.
#
# Ports are offset from the Supabase defaults only where they would otherwise
# collide with this workspace's own services (the API on 3000, Vite on
# 4200/4201).

project_id = "clinic-platform"

[api]
enabled = true
port = 54321
# Schemas exposed over PostgREST. `public` only for now: the clinic domain
# schema does not exist yet and will be added deliberately, table by table.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Keep this aligned with the Postgres version of the hosted project.
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Catches outbound mail locally so no real message is ever sent in development.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# The URL the browser is redirected back to after an auth flow. The mobile app
# runs on 4200 and the dashboard on 4201.
site_url = "http://localhost:4200"
additional_redirect_urls = ["http://localhost:4200", "http://localhost:4201"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local only: skips the confirmation round-trip while developing.
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

# Realtime is provisioned but unused. No realtime feature is implemented yet;
# leaving it enabled costs nothing locally and avoids a config change later.
[realtime]
enabled = true

[analytics]
enabled = false

[edge_runtime]
# Business logic lives in the NestJS API, not in Edge Functions. See
# docs/architecture.md for why.
enabled = false
